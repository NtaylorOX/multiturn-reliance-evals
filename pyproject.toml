[project]
name = "multiturn-reliance-evals"
version = "0.1.0"
description = "Do frontier models reinforce unhealthy emotional reliance over a multi-turn conversation?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3",
    "openai>=1.60",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "httpx>=0.28",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "fastapi>=0.159.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "ipykernel>=6.29", "nbconvert>=7.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redteam", "evals", "observability", "validation", "monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
