repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(results|validation)/.*\.(csv|jsonl?)$
      - id: end-of-file-fixer
        exclude: ^(results|validation)/.*\.(csv|jsonl?)$
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
  # ruff and mypy run from the project's locked versions, so a commit is checked exactly as CI checks it
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
