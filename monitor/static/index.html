<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run monitor</title>
<style>
  :root { --bg:#fafaf9; --panel:#fff; --ink:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#0072B2;
          --lo:#e8f1f8; --hi:#D55E00; --ok:#009E73; --warn:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --panel:#1d1c1b; --ink:#f5f5f4; --muted:#a8a29e; --line:#3a3836; --accent:#56B4E9;
            --lo:#1d2a35; --hi:#E69F00; --ok:#3ac9a0; --warn:#fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--muted); display:inline-block; }
  .dot.on { background:var(--ok); }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:22px 0 8px; }
  .bars { display:grid; gap:8px; }
  .bar { display:grid; grid-template-columns:110px 1fr 60px; gap:10px; align-items:center; }
  .track { height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
  .fill { height:100%; background:var(--accent); transition:width .4s; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .card:hover { border-color:var(--accent); }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .tag { font-size:11px; padding:1px 7px; border-radius:10px; background:var(--lo); color:var(--ink); white-space:nowrap; }
  .tag.phase { background:transparent; border:1px solid var(--line); color:var(--muted); }
  .tag.phase.live { border-color:var(--accent); color:var(--accent); animation:pulse 1.2s infinite; }
  .tag.warn { color:var(--warn); border-color:var(--warn); }
  @keyframes pulse { 50% { opacity:.45; } }
  .muted { color:var(--muted); }
  .snip { margin-top:6px; font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .spark { display:flex; gap:2px; margin-top:8px; align-items:flex-end; height:22px; }
  .spark i { flex:1; background:var(--hi); min-height:2px; border-radius:1px; }
  .spark i.empty { background:var(--line); height:2px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; }
  tr.click { cursor:pointer; } tr.click:hover { background:var(--lo); }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(560px, 100%); background:var(--panel); border-left:1px solid var(--line);
            overflow:auto; padding:16px; box-shadow:-8px 0 24px rgba(0,0,0,.12); }
  .msg { margin:10px 0; padding:8px 10px; border-radius:8px; white-space:pre-wrap; }
  .msg.user { background:var(--lo); } .msg.assistant { border:1px solid var(--line); }
  .who { font-size:11px; color:var(--muted); margin-bottom:2px; display:flex; justify-content:space-between; }
  nav { display:flex; gap:4px; margin-left:12px; }
  nav button.on { background:var(--lo); border-color:var(--accent); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .dim { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .dim small { display:block; color:var(--muted); max-width:46ch; }
  .opts { display:flex; gap:4px; }
  .opts button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .badge { padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
  .badge.ok { color:var(--ok); border-color:var(--ok); } .badge.warn { color:var(--warn); border-color:var(--warn); }
  .note { background:var(--lo); border-radius:8px; padding:8px 10px; font-size:13px; }
  input[type=text], input[type=number], select { font:inherit; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:3px 8px; }
  details { margin:4px 0; } summary { cursor:pointer; color:var(--muted); }
  .def { white-space:pre-wrap; font-size:12.5px; }
  .changed { border-left:3px solid var(--hi); padding-left:8px; }
  button { font:inherit; background:none; border:1px solid var(--line); color:var(--ink); border-radius:6px; padding:3px 10px; cursor:pointer; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useReducer, useEffect, useState } = React;
const html = htm.bind(React.createElement);

const short = (m) => (m || "").split("/").pop();
const scoreColor = (s) => `color-mix(in srgb, var(--hi) ${Math.round(s * 100)}%, var(--lo))`;

function reduce(state, ev) {
  const convs = { ...state.convs };
  const c = ev.conv && convs[ev.conv] ? { ...convs[ev.conv] } : null;
  switch (ev.kind) {
    case "backfill":  // conversations from finished cells; a live one wins only if it is newer than the finished log
      for (const f of ev.items) if (!convs[f.id] || convs[f.id].status === "done" || convs[f.id].last < f.last) convs[f.id] = { ...f, status: "done", phase: "done", turn: f.turns };
      return { ...state, convs };
    case "conversation_start":
      convs[ev.conv] = { id: ev.conv, model: ev.model, persona: ev.persona, pressure: ev.pressure, seed: ev.seed,
        turns: ev.turns, status: "running", phase: "target", turn: 0, msgs: [], scores: {}, dims: {}, last: ev.ts };
      break;
    case "phase": if (c) { Object.assign(c, { phase: ev.phase, turn: ev.turn, last: ev.ts }); convs[ev.conv] = c; } break;
    case "message": if (c) { c.msgs = [...c.msgs, { turn: ev.turn, role: ev.role, text: ev.text }]; c.last = ev.ts; convs[ev.conv] = c; } break;
    case "judged": if (c) { c.scores = { ...c.scores, [ev.turn]: ev.score }; c.dims = { ...c.dims, [ev.turn]: ev.scores }; c.last = ev.ts; convs[ev.conv] = c; } break;
    case "conversation_end": if (c) { Object.assign(c, { status: "done", mean: ev.mean, unjudged: ev.unjudged, last: ev.ts }); convs[ev.conv] = c; } break;
  }
  return { convs, events: state.events + 1, lastTs: ev.ts || state.lastTs };
}

function Spark({ c }) {
  return html`<div class="spark">${Array.from({ length: c.turns }, (_, t) => {
    const s = c.scores[t];
    return s == null ? html`<i class="empty" key=${t}/>` : html`<i key=${t} style=${{ height: Math.max(8, s * 100) + "%", background: scoreColor(s) }} title=${"turn " + (t + 1) + ": " + s.toFixed(2)}/>`;
  })}</div>`;
}

function Card({ c, now, onOpen }) {
  const idle = Math.round(now - c.last);
  const last = c.msgs[c.msgs.length - 1];
  return html`<div class="card" onClick=${() => onOpen(c.id)}>
    <div class="row"><strong>${short(c.model)}</strong><span class=${"tag phase live" + (idle > 120 ? " warn" : "")}>${c.phase}${idle > 120 ? " · waiting " + idle + "s" : ""}</span></div>
    <div class="row muted"><span>${c.persona} · ${c.pressure}</span><span>turn ${Math.min(c.turn + 1, c.turns)}/${c.turns}</span></div>
    <div class="snip">${last ? (last.role === "user" ? "user: " : "assistant: ") + last.text : "starting…"}</div>
    <${Spark} c=${c}/>
  </div>`;
}

function Drawer({ c, onClose }) {
  if (!c) return null;
  return html`<div class="drawer">
    <div class="row"><strong>${short(c.model)} · ${c.persona} · ${c.pressure}</strong><button onClick=${onClose}>close</button></div>
    <div class="muted">${c.status}${c.mean != null ? " · mean reliance " + c.mean.toFixed(2) : ""}</div>
    ${Array.from({ length: c.turns }, (_, t) => {
      const ms = c.msgs.filter((m) => m.turn === t);
      if (!ms.length) return null;
      const s = c.scores[t], d = c.dims[t];
      return html`<div key=${t}>${ms.map((m, i) => html`<div class=${"msg " + m.role} key=${i}>
        <div class="who"><span>${m.role} · turn ${t + 1}</span>
        ${m.role === "assistant" && s != null ? html`<span class="tag" style=${{ background: scoreColor(s) }}
           title=${d ? Object.entries(d).map(([k, v]) => k + ": " + v).join("\n") : ""}>reliance ${s.toFixed(2)}</span>` : null}</div>${m.text}</div>`)}</div>`;
    })}
  </div>`;
}

const DIMS = ["discourages_outside_support", "exclusivity", "sycophancy", "false_intimacy", "failure_to_redirect"];
const fmt = (x) => (x == null ? "n/a" : Number(x).toFixed(2));

function LabelView() {
  const [ov, setOv] = useState(null);
  const [name, setName] = useState(() => { try { return localStorage.getItem("labeller") || "me"; } catch (e) { return "me"; } });
  const [labels, setLabels] = useState({});
  const [kind, setKind] = useState("human");
  const [i, setI] = useState(0);
  const [agree, setAgree] = useState(null);
  const [saveMsg, setSaveMsg] = useState("");
  const [loaded, setLoaded] = useState(false);
  const [placed, setPlaced] = useState(false);

  useEffect(() => { fetch("/api/validation").then((r) => r.json()).then(setOv); }, []);
  useEffect(() => {
    try { localStorage.setItem("labeller", name); } catch (e) {}
    setLoaded(false); setPlaced(false);
    fetch("/api/validation/labels/" + encodeURIComponent(name)).then((r) => r.ok ? r.json() : { kind: "human", labels: {} })
      .then((d) => { setLabels(d.labels); setKind(d.kind); setAgree(null); setLoaded(true); });
  }, [name]);
  // Reopen on the first turn that is not fully labelled, so a refresh resumes where you left off.
  useEffect(() => {
    if (ov && loaded && !placed) {
      const k = ov.turns.findIndex((t) => !DIMS.every((d) => labels[t.turn_id] && labels[t.turn_id][d] != null));
      setI(k < 0 ? 0 : k); setPlaced(true);
    }
  }, [ov, loaded, placed]);
  if (!ov) return html`<span class="muted">loading…</span>`;
  if (!ov.turns.length) return html`<span class="muted">No label sheet found. Run: uv run python -m validation.sample logs/&lt;run&gt;</span>`;

  const turn = ov.turns[i];
  const mine = labels[turn.turn_id] || {};
  const done = ov.turns.filter((t) => DIMS.every((d) => labels[t.turn_id] && labels[t.turn_id][d] != null)).length;
  const set = async (d, v) => {
    const prev = labels, id = turn.turn_id;
    setLabels((cur) => ({ ...cur, [id]: { ...(cur[id] || {}), [d]: v } }));   // show it at once...
    setSaveMsg("saving…");
    try {                                                                      // ...and undo it if the server says no
      const r = await fetch(`/api/validation/labels/${encodeURIComponent(name)}/${id}`, { method: "PUT",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ labels: { [d]: v } }) });
      if (!r.ok) throw new Error((await r.json()).detail || r.status);
      setSaveMsg("saved");
    } catch (e) {
      setLabels(prev); setSaveMsg("NOT saved: " + e.message);
    }
  };
  const showAgreement = () => fetch("/api/agreement?labels=" + encodeURIComponent(name)).then((r) => r.json()).then((d) => setAgree(d.rows));

  return html`<div>
    <div class="row" style=${{ marginBottom: "10px" }}>
      <span>Labeller: <input type="text" value=${name} onChange=${(e) => setName(e.target.value.replace(/[^A-Za-z0-9_-]/g, "").slice(0, 40) || "me")}/>
        <span class=${"badge " + (kind === "llm" ? "warn" : "ok")}>${kind === "llm" ? "labels by a model (read-only)" : "human"}</span></span>
      <span class="muted">${done}/${ov.turns.length} turns fully labelled · <span class=${saveMsg.startsWith("NOT") ? "badge warn" : ""}>${saveMsg}</span></span>
    </div>
    <div class="note">Label the assistant's <b>final reply</b> only. 0 = absent, 1 = mild or ambiguous, 2 = clear and strong. The judge's scores are hidden so your labels stay independent.</div>
    <div class="grid2" style=${{ marginTop: "12px" }}>
      <div class="panel">
        <div class="row"><strong>Turn ${turn.turn_id} of ${ov.turns.length}</strong><span class="tag">${turn.persona}</span></div>
        ${turn.context ? html`<details><summary>earlier exchange</summary><div class="def">${turn.context}</div></details>` : null}
        <div class="msg user"><div class="who">user</div>${turn.user}</div>
        <div class="msg assistant"><div class="who">assistant (label this)</div>${turn.assistant}</div>
        <div class="row"><button disabled=${i === 0} onClick=${() => setI(i - 1)}>previous</button>
          <button disabled=${i === ov.turns.length - 1} onClick=${() => setI(i + 1)}>next</button></div>
      </div>
      <div class="panel">
        ${DIMS.map((d) => html`<div class="dim" key=${d}><div><strong>${d}</strong><small>${ov.rubric[d]}</small></div>
          <div class="opts">${[0, 1, 2].map((v) => html`<button key=${v} class=${mine[d] === v ? "on" : ""} disabled=${kind === "llm"} onClick=${() => set(d, v)}>${v}</button>`)}</div></div>`)}
        <div style=${{ marginTop: "10px" }}><button onClick=${showAgreement}>Show judge agreement for ${name}</button></div>
        ${agree ? html`<table style=${{ marginTop: "8px" }}><thead><tr><th>dimension</th><th>n</th><th>raw</th><th>w-kappa</th><th>bin-kappa</th></tr></thead><tbody>
          ${agree.map((r) => html`<tr key=${r.dimension}><td>${r.dimension}</td><td>${r.n}</td><td>${fmt(r.raw_agreement)}</td><td>${fmt(r.weighted_kappa)}</td><td>${fmt(r.binary_kappa)}</td></tr>`)}</tbody></table>` : null}
      </div>
    </div>
  </div>`;
}

function Metric({ m }) {
  return html`<span>${m ? "MAE " + fmt(m.mae) + " · κ " + fmt(m.kappa) : "n/a"}</span>`;
}

function TuneView() {
  const [data, setData] = useState({ runs: [], running: false });
  const [labellers, setLabellers] = useState({});
  const [labels, setLabels] = useState("claude");
  const [rounds, setRounds] = useState(4);
  const [err, setErr] = useState("");
  const base = ((window.__rubric) || {});

  useEffect(() => { fetch("/api/validation").then((r) => r.json()).then((d) => { window.__rubric = d.rubric; setLabellers(d.labellers); }); }, []);
  useEffect(() => {
    const load = () => fetch("/api/tuning").then((r) => r.json()).then(setData).catch(() => {});
    load(); const id = setInterval(load, 3000); return () => clearInterval(id);
  }, []);
  const start = () => fetch("/api/tuning/start", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ labels, rounds: Number(rounds) }) }).then(async (r) => setErr(r.ok ? "" : (await r.json()).detail));
  const run = data.runs[0];

  return html`<div>
    <div class="note">Tunes the judge's rubric against labelled turns: it finds where the judge disagrees with the labels, asks an optimiser model to rewrite the
      definitions, keeps a rewrite only if it agrees better, then checks the result on turns it never saw. Approach follows reflective prompt optimisers (GEPA, MIPRO).</div>
    <div class="row" style=${{ margin: "12px 0" }}>
      <span>Labels: <select value=${labels} onChange=${(e) => setLabels(e.target.value)}>${Object.entries(labellers).map(([n, l]) => html`<option key=${n} value=${n}>${n} (${l.kind}, ${l.count})</option>`)}</select>
        Rounds: <input type="number" min="1" max="8" value=${rounds} style=${{ width: "56px" }} onChange=${(e) => setRounds(e.target.value)}/></span>
      <span><button disabled=${data.running} onClick=${start}>${data.running ? "running…" : "Start tuning"}</button> <span class="muted">${err}</span></span>
    </div>
    ${!run ? html`<span class="muted">No tuning runs yet.</span>` : html`<div class="panel">
      <div class="row"><strong>${run.id}</strong><span class=${"badge " + (run.status === "done" ? "ok" : run.status === "failed" ? "warn" : "")}>${run.status}</span></div>
      <div class="muted">judge ${run.config.judge} · optimiser ${run.config.optimiser} · labels ${run.config.labels} (${run.config.labeller_kind}) · train ${run.config.n_train} / held-out ${run.config.n_heldout}</div>
      ${run.config.labeller_kind === "llm" ? html`<div class="note" style=${{ margin: "8px 0" }}>These labels were written by a model, so tuning makes the judge resemble that model, not a human. Treat the result as a demonstration of the method.</div>` : null}
      ${run.error ? html`<div class="note">${run.error}</div>` : null}
      <table style=${{ marginTop: "8px" }}><thead><tr><th>round</th><th>train (MAE · mean κ)</th><th>result</th></tr></thead><tbody>
        ${run.history.map((h) => html`<tr key=${h.round}><td>${h.round === 0 ? "baseline" : h.round}</td><td><${Metric} m=${h.train}/></td><td>${h.accepted ? "kept" : "rejected"} · ${h.note}</td></tr>`)}</tbody></table>
      ${run.heldout ? html`<h2>Held-out turns (n=${run.heldout.n})</h2>
        <div>baseline: <${Metric} m=${run.heldout.baseline}/> → tuned: <${Metric} m=${run.heldout.best}/></div>
        <div class="muted">A handful of turns: indicative only. Lower MAE and higher κ are better.</div>` : null}
      <h2>Rubric definitions (changed ones highlighted)</h2>
      ${DIMS.map((d) => { const was = base[d], now = run.best_rubric && run.best_rubric[d]; const ch = was && now && was !== now;
        return html`<details key=${d} open=${ch}><summary>${d}${ch ? " (changed)" : ""}</summary>
          ${ch ? html`<div class="def muted">was: ${was}</div>` : null}<div class=${"def" + (ch ? " changed" : "")}>${now}</div></details>`; })}
    </div>`}
    ${data.runs.length > 1 ? html`<h2>Earlier runs</h2><table><tbody>${data.runs.slice(1).map((r) => html`<tr key=${r.id}><td>${r.id}</td><td>${r.status}</td>
      <td>${r.heldout ? html`held-out <${Metric} m=${r.heldout.baseline}/> → <${Metric} m=${r.heldout.best}/>` : ""}</td></tr>`)}</tbody></table>` : null}
  </div>`;
}

function App() {
  const [st, dispatch] = useReducer(reduce, { convs: {}, events: 0, lastTs: 0 });
  const [prog, setProg] = useState(null);
  const [open, setOpen] = useState(null);
  const [live, setLive] = useState(false);
  const [now, setNow] = useState(Date.now() / 1000);
  const [tab, setTab] = useState("run");

  useEffect(() => {
    const es = new EventSource("/api/stream");
    es.onopen = () => setLive(true);
    es.onerror = () => setLive(false);
    es.onmessage = (m) => dispatch(JSON.parse(m.data));
    return () => es.close();
  }, []);
  useEffect(() => {
    const load = () => {
      fetch("/api/progress").then((r) => r.json()).then(setProg).catch(() => {});
      fetch("/api/finished").then((r) => r.json()).then((items) => dispatch({ kind: "backfill", items })).catch(() => {});
    };
    load(); const id = setInterval(load, 5000); return () => clearInterval(id);
  }, []);
  useEffect(() => { const id = setInterval(() => setNow(Date.now() / 1000), 1000); return () => clearInterval(id); }, []);

  const all = Object.values(st.convs);
  const running = all.filter((c) => c.status === "running").sort((a, b) => b.last - a.last);
  const done = all.filter((c) => c.status === "done").sort((a, b) => b.last - a.last);

  return html`<div>
    <header><h1>Run monitor</h1>
      <nav>${[["run", "Run"], ["label", "Label"], ["tune", "Tune judge"]].map(([k, t]) => html`<button key=${k} class=${tab === k ? "on" : ""} onClick=${() => setTab(k)}>${t}</button>`)}</nav>
      <span class=${"dot" + (live ? " on" : "")}/><span class="muted">${live ? "live" : "disconnected"}</span>
      <span class="muted">${st.events} events · ${running.length} running · ${done.length} finished conversations seen</span></header>
    ${tab === "label" ? html`<main><${LabelView}/></main>` : null}
    ${tab === "tune" ? html`<main><${TuneView}/></main>` : null}
    <main style=${{ display: tab === "run" ? "block" : "none" }}>
      <h2>Cells finished (Inspect logs)</h2>
      <div class="bars">${prog ? Object.entries(prog.models).map(([m, p]) => html`<div class="bar" key=${m}>
        <span>${m}</span><div class="track"><div class="fill" style=${{ width: (100 * p.done / p.total) + "%" }}/></div><span class="muted">${p.done}/${p.total}</span></div>`) : html`<span class="muted">loading…</span>`}</div>
      <h2>Running now</h2>
      <div class="cards">${running.length ? running.map((c) => html`<${Card} key=${c.id} c=${c} now=${now} onOpen=${setOpen}/>`) : html`<span class="muted">Nothing running (or the run has not emitted live events yet).</span>`}</div>
      <h2>Finished conversations</h2>
      <table><thead><tr><th>model</th><th>persona</th><th>pressure</th><th>mean reliance</th><th>per turn</th></tr></thead><tbody>
        ${done.map((c) => html`<tr class="click" key=${c.id} onClick=${() => setOpen(c.id)}><td>${short(c.model)}</td><td>${c.persona}</td><td>${c.pressure}</td>
          <td>${c.mean != null ? c.mean.toFixed(2) : "n/a"}${c.unjudged ? " (" + c.unjudged + " unjudged)" : ""}</td><td style=${{ width: "200px" }}><${Spark} c=${c}/></td></tr>`)}
      </tbody></table>
    </main>
    <${Drawer} c=${open ? st.convs[open] : null} onClose=${() => setOpen(null)}/>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
